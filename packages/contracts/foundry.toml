[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# the deploy script writes deployments/arc-<testnet|mainnet>.json in the repo root
fs_permissions = [
  { access = "read", path = "./test/utils/bytecode" },
  { access = "read-write", path = "../../deployments" },
]
remappings = ["forge-std/=lib/forge-std/src/"]
ffi = true

[fuzz]
runs = 512

[lint]
lint_on_build = false

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"
